<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Codename Starfall</title>
    <style>*{box-sizing:border-box;margin:0;padding:0}html,body{width:100%;min-height:100%}body{color:#eee;overscroll-behavior:none;background:#1a1a2e;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;overflow:hidden}#game-container{flex-direction:column;width:100vw;height:100dvh;display:flex}#canvas-container{flex:1;position:relative}#game-canvas{width:100%;height:100%;display:block}#ui-overlay{pointer-events:none;width:100%;height:100%;position:absolute;top:0;left:0}#connection-status{z-index:100;pointer-events:auto;border-radius:4px;padding:8px 16px;font-size:14px;font-weight:500;position:absolute;top:16px;left:16px}.status-connecting{color:#1a1a2e;background:#f59e0b}.status-connected{color:#1a1a2e;background:#10b981}.status-disconnected,.status-error{color:#fff;background:#ef4444}#lobby-ui{text-align:center;pointer-events:auto;z-index:50;background:#1a1a2ef2;border:1px solid #374151;border-radius:12px;min-width:300px;padding:32px;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%)}#lobby-ui.hidden{display:none}#lobby-ui h1{margin-bottom:24px;font-size:28px}#lobby-ui input{color:#eee;background:#1f2937;border:1px solid #374151;border-radius:8px;width:100%;margin-bottom:16px;padding:12px 16px;font-size:16px}#lobby-ui input:focus{border-color:#3b82f6;outline:none}#lobby-ui button{color:#fff;cursor:pointer;background:#3b82f6;border:none;border-radius:8px;width:100%;padding:12px 24px;font-size:16px;font-weight:600;transition:background .2s}#lobby-ui button:hover{background:#2563eb}#lobby-ui button:disabled{cursor:not-allowed;background:#4b5563}#players-list{text-align:left;margin-top:24px}#players-list h3{color:#9ca3af;margin-bottom:12px;font-size:14px}.player-item{background:#1f2937;border-radius:6px;align-items:center;gap:12px;margin-bottom:8px;padding:8px 12px;display:flex}.player-color{border-radius:50%;width:16px;height:16px}.player-name{flex:1}.player-you{color:#3b82f6;background:#3b82f633;border-radius:4px;padding:2px 6px;font-size:12px}@media (width<=640px){#connection-status{top:max(12px, env(safe-area-inset-top));left:max(12px, env(safe-area-inset-left));padding:6px 10px;font-size:12px}#lobby-ui{width:min(94vw,440px);max-height:calc(100dvh - 24px - env(safe-area-inset-top) - env(safe-area-inset-bottom));padding:20px;overflow-y:auto}#lobby-ui h1{margin-bottom:16px;font-size:24px}#lobby-ui input,#lobby-ui button{min-height:48px;font-size:16px}}@media (orientation:landscape) and (height<=540px){#lobby-ui{top:max(12px, env(safe-area-inset-top));max-height:calc(100dvh - 24px - env(safe-area-inset-top) - env(safe-area-inset-bottom));transform:translate(-50%)}}</style>
    <script type="module" crossorigin src="/assets/index-CYjdXXML.js"></script>
  </head>
  <body>
    <div id="game-container">
      <div id="canvas-container">
        <canvas id="game-canvas"></canvas>
        <div id="ui-overlay">
          <div id="connection-status" class="status-connecting">
            Connecting...
          </div>
          <div id="lobby-ui">
            <h1>Codename Starfall</h1>
            <input
              type="text"
              id="player-name"
              placeholder="Enter your display name"
              maxlength="24"
              disabled
            />
            <p
              id="profile-feedback"
              role="status"
              style="margin: -8px 0 16px; color: #9ca3af; font-size: 13px"
            >
              Loading account…
            </p>
            <button id="join-btn" disabled>Save Profile &amp; Join</button>
            <div id="players-list">
              <h3>Players (0/10)</h3>
              <div id="players-container"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
