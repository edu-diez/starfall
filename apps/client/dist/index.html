<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Among Us - Codename Starfall</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #1a1a2e;
        color: #eee;
        overflow: hidden;
      }
      #game-container {
        width: 100vw;
        height: 100vh;
        display: flex;
        flex-direction: column;
      }
      #canvas-container {
        flex: 1;
        position: relative;
      }
      #game-canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      #ui-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }
      #connection-status {
        position: absolute;
        top: 16px;
        left: 16px;
        padding: 8px 16px;
        border-radius: 4px;
        font-size: 14px;
        font-weight: 500;
        z-index: 100;
        pointer-events: auto;
      }
      .status-connecting { background: #f59e0b; color: #1a1a2e; }
      .status-connected { background: #10b981; color: #1a1a2e; }
      .status-disconnected { background: #ef4444; color: white; }
      .status-error { background: #ef4444; color: white; }
      #lobby-ui {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: rgba(26, 26, 46, 0.95);
        padding: 32px;
        border-radius: 12px;
        border: 1px solid #374151;
        text-align: center;
        min-width: 300px;
        pointer-events: auto;
        z-index: 50;
      }
      #lobby-ui.hidden { display: none; }
      #lobby-ui h1 { margin-bottom: 24px; font-size: 28px; }
      #lobby-ui input {
        width: 100%;
        padding: 12px 16px;
        margin-bottom: 16px;
        border: 1px solid #374151;
        border-radius: 8px;
        background: #1f2937;
        color: #eee;
        font-size: 16px;
      }
      #lobby-ui input:focus { outline: none; border-color: #3b82f6; }
      #lobby-ui button {
        width: 100%;
        padding: 12px 24px;
        background: #3b82f6;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.2s;
      }
      #lobby-ui button:hover { background: #2563eb; }
      #lobby-ui button:disabled { background: #4b5563; cursor: not-allowed; }
      #players-list { margin-top: 24px; text-align: left; }
      #players-list h3 { margin-bottom: 12px; font-size: 14px; color: #9ca3af; }
      .player-item {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 8px 12px;
        background: #1f2937;
        border-radius: 6px;
        margin-bottom: 8px;
      }
      .player-color {
        width: 16px;
        height: 16px;
        border-radius: 50%;
      }
      .player-name { flex: 1; }
      .player-you { font-size: 12px; color: #3b82f6; background: rgba(59, 130, 246, 0.2); padding: 2px 6px; border-radius: 4px; }
    </style>
    <script type="module" crossorigin src="/assets/index-CGX82irc.js"></script>
  </head>
  <body>
    <div id="game-container">
      <div id="canvas-container">
        <canvas id="game-canvas"></canvas>
        <div id="ui-overlay">
          <div id="connection-status" class="status-connecting">Connecting...</div>
          <div id="lobby-ui">
            <h1>Codename Starfall</h1>
            <input type="text" id="player-name" placeholder="Enter your name" maxlength="20" />
            <button id="join-btn" disabled>Join Game</button>
            <div id="players-list">
              <h3>Players (0/10)</h3>
              <div id="players-container"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
